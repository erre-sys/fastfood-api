name: Sync PR & Outline

on:
  pull_request:
    types: [labeled]

jobs:
  update-outline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Leer PR
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const label = context.payload.label.name;

            const urlMatch = body.match(/https?:\/\/[^\s]*outline[^\s]*\/doc\/([^\s)]+)/);
            if (!urlMatch) {
              console.log('Sin URL de Outline en el PR');
              return core.setOutput('skip', 'true');
            }

            const slug = urlMatch[1];
            console.log(`Slug: ${slug}, Label: ${label}`);

            const estados = {
              'doChanges':      '🔴 Requiere cambios',
              'conflictos':     '⚠️ Conflictos',
              'bug':            '🐛 Bug fix',
              'QAReady':        '✅ Aprobado por QA',
              'Merged':         '🟢 Mergeado',
              'readyToDeploy':  '🚀 Listo para deploy'
            };

            if (!estados[label]) {
              console.log(`Label "${label}" sin estado mapeado`);
              return core.setOutput('skip', 'true');
            }

            core.setOutput('skip', 'false');
            core.setOutput('slug', slug);
            core.setOutput('status', estados[label]);

      - name: Actualizar Outline
        if: steps.parse.outputs.skip != 'true'
        env:
          TOKEN: ${{ secrets.OUTLINE_API_TOKEN }}
          BASE: ${{ secrets.OUTLINE_BASE_URL }}
          SLUG: ${{ steps.parse.outputs.slug }}
          STATUS: ${{ steps.parse.outputs.status }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Obtener documento por slug completo
          DOC=$(curl -s "$BASE/api/documents.info" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"id\": \"$SLUG\"}")

          DOC_ID=$(echo "$DOC" | jq -r '.data.id // empty')
          [ -z "$DOC_ID" ] && echo "Documento no encontrado: $SLUG" && exit 1

          CONTENT=$(echo "$DOC" | jq -r '.data.text')

          DATE=$(date +"%Y-%m-%d %H:%M UTC")
          ENTRY="| $DATE | $STATUS | [$PR_TITLE]($PR_URL) | [PR]($PR_URL) |"

          if echo "$CONTENT" | grep -q "## Estado:"; then
            CONTENT=$(echo "$CONTENT" | sed "s/## Estado:.*/## Estado: $STATUS/")
          fi

          if echo "$CONTENT" | grep -q "Historial de cambios"; then
            CONTENT=$(echo "$CONTENT" | sed "/| | ⚪ Sin iniciar/d")
            CONTENT=$(echo "$CONTENT" | sed "/|-------|--------|--------|------|/a\\
          $ENTRY")
          fi

          ESCAPED=$(echo "$CONTENT" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/api/documents.update" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"id\": \"$DOC_ID\", \"text\": $ESCAPED}")

          [ "$HTTP" = "200" ] && echo "✅ $STATUS → $DOC_ID" || (echo "❌ HTTP $HTTP" && exit 1)

      - name: Confirmar en PR
        if: steps.parse.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `📝 Outline actualizado → **${{ steps.parse.outputs.status }}**`
            });